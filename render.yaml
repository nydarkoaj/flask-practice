# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + > Blueprint > select this repository. See DEPLOY.md.
services:
  - type: web
    name: company-website          # also sets the free address: company-website.onrender.com (if available)
    runtime: python
    plan: free                     # "starter" or above avoids cold starts after 15 minutes idle
    branch: dev                    # the branch Render deploys; change if you deploy from another
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: ENQUIRY_TO            # inbox that receives contact-form enquiries
        sync: false
      - key: SMTP_HOST             # e.g. smtp.gmail.com, smtp.zoho.com, smtp-relay.brevo.com
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM             # optional; defaults to SMTP_USER
        sync: false
    # Uncomment after buying the domain (replace example.com). Render then shows the DNS records to add.
    # domains:
    #   - example.com
    #   - www.example.com
